# Ujian asap: pasang APK release pada emulator Android, buka app, rekod logcat dan tangkapan skrin.
# Hasil dimuat naik ke Releases → "ujian-asap" supaya punca crash boleh dibaca.
name: Ujian asap emulator

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'store/**', '**.md']
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Bina APK release (x86_64 untuk emulator)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Hidupkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Jalankan pada emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Muat naik hasil
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp -f smoke-* out/ 2>/dev/null || true
          ls -la out
          gh release delete ujian-asap --yes --cleanup-tag 2>/dev/null || true
          gh release create ujian-asap out/* --prerelease --title "Ujian asap ${GITHUB_SHA::7}" --notes "Logcat dan tangkapan skrin daripada emulator API 34."
